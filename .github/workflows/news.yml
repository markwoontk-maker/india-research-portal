name: Refresh news

# Rebuilds data/news.json for the News tab ("News You Need to Know") from Google
# News RSS. Same approach as the Indonesia portal: the page only reads the JSON.
# Local PC scripts also push to main, so they `git pull --rebase` first, and this
# job retries a rebase + push if one of them got in between.

on:
  schedule:
    # Every 30 min, 06:10-23:10 IST on weekdays (00:40-17:40 UTC).
    - cron: "10,40 0-17 * * 1-5"
    # Overnight + weekends: every 3 hours.
    - cron: "25 19,22 * * 1-5"
    - cron: "25 */3 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google News
        run: python3 scripts/refresh_news.py
      - name: Commit
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: news refresh $(date -u +'%Y-%m-%d %H:%M')Z"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
