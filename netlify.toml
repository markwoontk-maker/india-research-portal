[build]
  publish = "."
  functions = "netlify/functions"

# Top-level directory key so `netlify deploy --dir=.` (no build step,
# as run in CI) still bundles and ships the functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Friendly paths -> functions
[[redirects]]
  from = "/api/yahoo"
  to = "/.netlify/functions/yahoo"
  status = 200

[[redirects]]
  from = "/api/movers"
  to = "/.netlify/functions/movers"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/macro"
  to = "/.netlify/functions/macro"
  status = 200

[[redirects]]
  from = "/api/earncal"
  to = "/.netlify/functions/earncal"
  status = 200
